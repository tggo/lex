name: Rebuild datasets

# Rebuild prebuilt datasets from the official sources once a month and publish
# them to the fixed `datasets` release, so `lex` users pull ready data instead
# of scraping (see ADR-0029). Also runnable on demand.
on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write # upload release assets

concurrency:
  group: datasets
  cancel-in-progress: false

jobs:
  ukraine:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Ukraine dataset (articles + relations)
        # -delay paces requests to be polite to the source; retries are built in.
        run: go run ./ua/scripts/import -out ua/data -articles -relations -cache "" -delay 150ms

      - name: Package
        run: tar --no-xattrs -C ua/data -czf lex-ua.tar.gz graph index.fts

      - name: Publish to the datasets release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view datasets >/dev/null 2>&1 || \
            gh release create datasets --title "Prebuilt datasets" --latest=false \
              --notes "Prebuilt lex datasets (graph + full-text index). Rebuilt monthly."
          gh release upload datasets \
            "lex-ua.tar.gz#lex-ua.tar.gz (Ukraine — articles + relations)" --clobber

  # To add a country, copy the `ukraine` job: its importer must accept
  # `-out <cc>/data` and produce <cc>/data/{graph,index.fts}, then package and
  # upload as `lex-<cc>.tar.gz`. (Align jp/pl/... to the dataset-root layout
  # first — see docs/TODO.md.)
